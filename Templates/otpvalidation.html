{% extends 'voterhome.html' %}
{% block content %}
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
    {% endfor %}
{% endif %}
<form action="" method="post">
    {% csrf_token %}
    <div class="row">
        <div class="col-12 form-group">
            <label for="otp">Enter OTP sent to your email:</label>
            <input type="text" class="form-control border-0 p-4" id="otp" name="otp" placeholder="OTP" required="required" />
        </div>
        <div class="col-12 form-group">
            <button class="btn btn-primary btn-block border-0 py-3" type="submit">Validate OTP</button> 
        </div>
    </div>
</form>
{% endblock %}
