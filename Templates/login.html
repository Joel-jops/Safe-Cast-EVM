{% extends "Common.html" %}
{% block content %}
<!-- message -->
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <!-- <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button> -->
        </div>
    {% endfor %}
{% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="row">
            <div class="col-12 form-group">
                <input type="text" name="username" class="form-control border-0 p-4" placeholder="Username" required="required" />
            </div>
            <div class="col-12 form-group">
                <input type="password" name="password" class="form-control border-0 p-4" placeholder="Password" required="required" />
            </div>
            <div class="col-12 form-group">
                <button class="btn btn-primary btn-block border-0 py-3" type="submit">Login</button> 
            </div>
        </div>
    </form>
{% endblock %}
